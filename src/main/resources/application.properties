spring.application.name=oportunidades

# Servidor: escuchar en todas las interfaces para permitir conexión desde Android (emulador 10.0.2.2 o móvil físico)
server.address=0.0.0.0
server.port=8080

# Configuración de DataSource MySQL (XAMPP)
# createDatabaseIfNotExist=true crea automáticamente la BD en MySQL si no existe
spring.datasource.url=jdbc:mysql://localhost:3306/oportunidades_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
